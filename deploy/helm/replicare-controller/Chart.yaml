apiVersion: v2
name: replicare-controller
description: >-
  replicare — an open-source, high-performance data replication daemon for
  Postgres, MySQL, and Redis. This chart deploys the single-daemon (run) mode:
  one replica that owns each sync via the state store's single-active lock.
type: application
# Chart version — bump on chart changes. The release workflow overrides this from
# the pushed git tag (a `vX.Y.Z` tag publishes chart X.Y.Z), so this in-repo value
# is just the development placeholder.
version: 0.1.1
# The replicare release this chart targets (image tag default). Keep in step with
# the app; override image.tag per deployment. The release workflow also sets this
# from the git tag at package time.
appVersion: "0.1.1"
home: https://github.com/rudimk/replicare
sources:
  - https://github.com/rudimk/replicare
keywords:
  - replication
  - postgres
  - mysql
  - redis
  - cdc
maintainers:
  - name: replicare
    url: https://github.com/rudimk/replicare
