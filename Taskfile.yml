version: '3'

vars:
  BINARY: replicare
  PKG: ./...
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -X github.com/rudimk/replicare/internal/buildinfo.Version={{.VERSION}}
    -X github.com/rudimk/replicare/internal/buildinfo.Commit={{.COMMIT}}
    -X github.com/rudimk/replicare/internal/buildinfo.Date={{.DATE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the replicare binary into ./bin
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} ./cmd/replicare

  dist:
    desc: Build a static, stripped release binary into ./dist (CGO-free, pure Go)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-s -w {{.LDFLAGS}}" -o dist/{{.BINARY}} ./cmd/replicare
      - 'echo "built dist/{{.BINARY}} ({{.VERSION}})"'

  docker:
    desc: Build the replicare Docker image (tags :VERSION and :latest)
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        --build-arg DATE={{.DATE}}
        -t {{.BINARY}}:{{.VERSION}} -t {{.BINARY}}:latest .

  run:
    desc: Run replicare (pass args after --, e.g. `task run -- version`)
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/replicare {{.CLI_ARGS}}

  fmt:
    desc: Format all Go code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet {{.PKG}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  test:
    desc: Run unit tests
    cmds:
      - go test {{.PKG}}

  test:race:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race {{.PKG}}

  test:integration:
    desc: Run integration tests against the multi-version harness (brings it up/down)
    cmds:
      - task: harness:up
      - defer: { task: harness:down }
      # -p 1 serializes packages: integration tests share the one harness and
      # would otherwise clobber each other's schemas (rc_it, replicare_state).
      - REPLICARE_INTEGRATION=1 go test -count=1 -p 1 {{.PKG}}

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  ci:
    desc: Run the full CI gate (format check, vet, lint, race tests, build)
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test:race
      - task: build

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin

  harness:up:
    desc: Start the multi-version Postgres test harness (old source + modern target)
    cmds:
      - docker compose -f test/harness/docker-compose.yml up -d --wait

  harness:down:
    desc: Stop and remove the test harness (ephemeral data is discarded)
    cmds:
      - docker compose -f test/harness/docker-compose.yml down -v

  harness:config:
    desc: Validate the harness compose file
    cmds:
      - docker compose -f test/harness/docker-compose.yml config -q

  harness:mysql:up:
    desc: Start the multi-version MySQL test harness (5.7 source + 8.4 target)
    cmds:
      - docker compose -f test/harness-mysql/docker-compose.yml up -d --wait

  harness:mysql:down:
    desc: Stop and remove the MySQL test harness (ephemeral data is discarded)
    cmds:
      - docker compose -f test/harness-mysql/docker-compose.yml down -v

  harness:mysql:config:
    desc: Validate the MySQL harness compose file
    cmds:
      - docker compose -f test/harness-mysql/docker-compose.yml config -q

  test:integration:mysql:
    desc: Run MySQL integration tests against the 5.7->8.4 harness (brings it up/down)
    cmds:
      - task: harness:mysql:up
      - defer: { task: harness:mysql:down }
      # -p 1 serializes packages: integration tests share the one harness and
      # would otherwise clobber each other's schemas.
      - REPLICARE_INTEGRATION=1 REPLICARE_MYSQL=1 go test -count=1 -p 1 {{.PKG}}
