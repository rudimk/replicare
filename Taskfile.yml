version: '3'

vars:
  BINARY: replicare
  PKG: ./...
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -X github.com/rudimk/replicare/internal/buildinfo.Version={{.VERSION}}
    -X github.com/rudimk/replicare/internal/buildinfo.Commit={{.COMMIT}}
    -X github.com/rudimk/replicare/internal/buildinfo.Date={{.DATE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the replicare binary into ./bin
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} ./cmd/replicare

  dist:
    desc: Build a static, stripped release binary into ./dist (CGO-free, pure Go)
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-s -w {{.LDFLAGS}}" -o dist/{{.BINARY}} ./cmd/replicare
      - 'echo "built dist/{{.BINARY}} ({{.VERSION}})"'

  docker:
    desc: Build the replicare Docker image (tags :VERSION and :latest)
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        --build-arg DATE={{.DATE}}
        -t {{.BINARY}}:{{.VERSION}} -t {{.BINARY}}:latest .

  run:
    desc: Run replicare (pass args after --, e.g. `task run -- version`)
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/replicare {{.CLI_ARGS}}

  fmt:
    desc: Format all Go code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet {{.PKG}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  test:
    desc: Run unit tests
    cmds:
      - go test {{.PKG}}

  test:race:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race {{.PKG}}

  test:integration:
    desc: Run integration tests against the multi-version harness (brings it up/down)
    cmds:
      - task: harness:up
      - defer: { task: harness:down }
      # -p 1 serializes packages: integration tests share the one harness and
      # would otherwise clobber each other's schemas (rc_it, replicare_state).
      - REPLICARE_INTEGRATION=1 go test -count=1 -p 1 {{.PKG}}

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  ci:
    desc: Run the full CI gate (format check, vet, lint, race tests, build)
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test:race
      - task: build

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin

  harness:up:
    desc: Start the multi-version Postgres test harness (old source + modern target)
    cmds:
      - docker compose -f test/harness/docker-compose.yml up -d --wait

  harness:down:
    desc: Stop and remove the test harness (ephemeral data is discarded)
    cmds:
      - docker compose -f test/harness/docker-compose.yml down -v

  harness:config:
    desc: Validate the harness compose file
    cmds:
      - docker compose -f test/harness/docker-compose.yml config -q

  harness:mysql:up:
    desc: Start the multi-version MySQL test harness (5.7 source + 8.4 target)
    cmds:
      - docker compose -f test/harness-mysql/docker-compose.yml up -d --wait

  harness:mysql:down:
    desc: Stop and remove the MySQL test harness (ephemeral data is discarded)
    cmds:
      - docker compose -f test/harness-mysql/docker-compose.yml down -v

  harness:mysql:config:
    desc: Validate the MySQL harness compose file
    cmds:
      - docker compose -f test/harness-mysql/docker-compose.yml config -q

  test:integration:mysql:
    desc: Run MySQL integration tests against the 5.7->8.4 harness (brings it up/down)
    cmds:
      - task: harness:mysql:up
      - defer: { task: harness:mysql:down }
      # -p 1 serializes packages: integration tests share the one harness and
      # would otherwise clobber each other's schemas.
      - REPLICARE_INTEGRATION=1 REPLICARE_MYSQL=1 go test -count=1 -p 1 {{.PKG}}

  harness:redis:up:
    desc: Start the multi-version standalone Redis test harness (6.2 source + 7.4 target)
    cmds:
      - docker compose -f test/harness-redis/docker-compose.yml up -d --wait

  harness:redis:down:
    desc: Stop and remove the standalone Redis test harness (ephemeral data discarded)
    cmds:
      - docker compose -f test/harness-redis/docker-compose.yml down -v

  harness:redis:config:
    desc: Validate the standalone Redis harness compose file
    cmds:
      - docker compose -f test/harness-redis/docker-compose.yml config -q

  harness:redis:cluster:up:
    desc: Start the 3-node Redis Cluster harness and assert cluster_state:ok (Linux/host-net only)
    cmds:
      - docker compose -f test/harness-redis-cluster/docker-compose.yml up -d --wait node1 node2 node3
      - docker compose -f test/harness-redis-cluster/docker-compose.yml up cluster-init
      # Poll until the cluster forms (a node healthcheck can't assert this without
      # deadlocking the one-shot init).
      - >-
        for i in $(seq 1 30); do
          redis-cli -p 7000 cluster info 2>/dev/null | grep -q 'cluster_state:ok' && { echo "cluster_state:ok"; exit 0; };
          sleep 1;
        done; echo "cluster did not reach state ok" >&2; exit 1

  harness:redis:cluster:down:
    desc: Stop and remove the Redis Cluster harness
    cmds:
      - docker compose -f test/harness-redis-cluster/docker-compose.yml down -v

  test:integration:redis:
    desc: Run Redis integration tests against the 6.2->7.4 standalone harness (brings it up/down)
    cmds:
      - task: harness:redis:up
      - defer: { task: harness:redis:down }
      - REPLICARE_INTEGRATION=1 REPLICARE_REDIS=1 go test -count=1 -p 1 {{.PKG}}

  test:integration:redis:cluster:
    desc: Run Redis cluster integration tests against the 3-node cluster harness (Linux/host-net)
    cmds:
      - task: harness:redis:cluster:up
      - defer: { task: harness:redis:cluster:down }
      - REPLICARE_INTEGRATION=1 REPLICARE_REDIS_CLUSTER=1 go test -count=1 -p 1 ./internal/engine/redis/

  test:integration:dual:
    desc: Run daemon engine-coexistence tests against BOTH harnesses (Postgres + MySQL)
    cmds:
      # MM7 needs all three databases at once: a MySQL source+target for the
      # MySQL sync's data, a Postgres source+target for the coexisting Postgres
      # sync's data, and the Postgres state store (v1's only StateStore backend).
      - task: harness:up
      - task: harness:mysql:up
      - defer: { task: harness:mysql:down }
      - defer: { task: harness:down }
      - REPLICARE_INTEGRATION=1 REPLICARE_MYSQL=1 go test -count=1 -p 1 ./internal/daemon/...

  test:integration:tri:
    desc: Run daemon tri-engine coexistence tests against ALL THREE harnesses (Postgres + MySQL + Redis)
    cmds:
      # RM9 runs Redis, Postgres and MySQL syncs in one daemon: the Postgres pair
      # (source+target+state store), the MySQL pair, and the standalone Redis pair
      # (6.2 source -> 7.4 target). Standalone Redis, not cluster, for coexistence.
      - task: harness:up
      - task: harness:mysql:up
      - task: harness:redis:up
      - defer: { task: harness:redis:down }
      - defer: { task: harness:mysql:down }
      - defer: { task: harness:down }
      - REPLICARE_INTEGRATION=1 REPLICARE_MYSQL=1 REPLICARE_REDIS=1 go test -count=1 -p 1 ./internal/daemon/...
