name: Docs

# Builds the mdBook docs site (book.toml, src docs/) on every PR, and on every push to main
# also publishes it to GitHub Pages, served at https://replicare.rudimk.com.
# One-time repo setup: Settings → Pages → Source = "GitHub Actions", custom domain
# replicare.rudimk.com; DNS: CNAME replicare → rudimk.github.io.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: v0.4.40

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the site
        # create-missing = false in book.toml: a page listed in SUMMARY.md that does not exist
        # fails the build. Link and content checks run in the CI workflow (internal/docscheck).
        run: mdbook build

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deploy half-way; a newer push queues behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

