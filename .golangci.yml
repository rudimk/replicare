version: "2"

linters:
  default: standard
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  settings:
    errcheck:
      # Writes to stdout/stderr return errors that are not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # bufio.Writer errors are sticky: they surface on the checked Flush, so
        # individual buffered writes need not be checked (mysql LOAD DATA serializer).
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteRune
        - (*bufio.Writer).Write
  exclusions:
    generated: lax
    rules:
      # Tests may ignore errors for brevity.
      - path: _test\.go
        linters:
          - errcheck
