version: "2"

linters:
  default: standard
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  settings:
    errcheck:
      # Writes to stdout/stderr return errors that are not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    rules:
      # Tests may ignore errors for brevity.
      - path: _test\.go
        linters:
          - errcheck
